# ============================================================
# GitHub Actions Workflow: Automatická aktualizace CS2 inventáře
# ============================================================
# Tento soubor říká GitHubu, aby každý den automaticky spustil
# náš Python skript, který stáhne ceny a aktualizuje web.
#
# DŮLEŽITÉ: Tento workflow běží na TVÉM VLASTNÍM MACU (self-hosted
# runner), ne na cizích serverech GitHubu! Důvod: Steam blokuje
# sdílené serverové IP adresy (chyba 429 Too Many Requests), ale
# tvoje domácí IP adresa blokovaná není.
#
# ⚠️ Tvůj Mac musí být v čase spuštění ZAPNUTÝ a PŘIPOJENÝ K
# INTERNETU (nesmí spát), jinak se automatické spuštění nepovede.
# Pokud to nevyjde, můžeš workflow kdykoliv spustit ručně tlačítkem
# "Run workflow" v záložce Actions.
#
# Cron výraz "37 6 * * *" = každý den v 6:37 UTC
# (aktuálně, v letním čase, to vychází na 8:37 SELČ)
# ============================================================

name: Update CS2 Inventory Prices

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    name: Fetch Inventory and Update Prices
    runs-on: self-hosted   # ← běží na tvém Macu, ne na cizím serveru

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Na self-hosted runneru už Python nainstalujeme sami (Krok 0
      # návodu), takže tenhle krok jen ověří, že je vše v pořádku.
      - name: Check Python is available
        run: python3 --version

      - name: Ensure data directory exists
        run: |
          mkdir -p data
          if [ ! -f data/history.json ]; then
            echo "{}" > data/history.json
          fi
          if [ ! -f data/summary.json ]; then
            echo "{}" > data/summary.json
          fi
          if [ ! -f data/purchase_prices.json ]; then
            echo "{}" > data/purchase_prices.json
          fi

      # POZOR: na Macu je příkaz "python3", ne "python"!
      - name: Run inventory fetch script
        run: python3 fetch_inventory.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/history.json data/summary.json
          if git diff --staged --quiet; then
            echo "Žádné změny k uložení."
          else
            git commit -m "Auto-update: inventory prices $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
